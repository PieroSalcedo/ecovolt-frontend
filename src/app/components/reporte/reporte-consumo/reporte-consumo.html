<div class="container mt-4 mb-5">
  <mat-toolbar color="primary" class="rounded shadow mb-4">
    <span>📊 Inteligencia Energética: Dashboard Maestro</span>
  </mat-toolbar>

  <div class="row">
    <!-- NIVEL 1: COMPARATIVA GLOBAL -->
    <div class="col-12 mb-4">
      <mat-card class="p-4 shadow-sm border-0">
        <mat-card-title class="text-success mb-3">1. Consumo por Vivienda (Watts)</mat-card-title>
        <div style="height: 300px;">
          <canvas baseChart [data]="barData" [type]="'bar'"></canvas>
        </div>
      </mat-card>
    </div>

    <!-- NIVEL 2: DISTRIBUCIÓN POR CUARTOS -->
    <div class="col-md-6">
      <mat-card class="p-4 shadow-sm border-0" style="min-height: 500px;">
        <mat-card-title class="text-primary">2. Reparto por Ambientes</mat-card-title>
        
        <label class="mt-3">Selecciona una Vivienda:</label>
        <select class="form-control mb-4" [(ngModel)]="idHomeSel" (change)="onCasaChange()">
          <option [value]="-1">-- Ver detalle de una casa --</option>
          <option *ngFor="let c of misCasas" [value]="c.idHome">{{c.alias}}</option>
        </select>

        <div style="height: 300px;" *ngIf="idHomeSel != -1">
          <canvas baseChart [data]="pieData" [type]="'pie'"></canvas>
        </div>
        <div class="text-center mt-5 text-muted" *ngIf="idHomeSel == -1">
          <mat-icon style="font-size: 50px; width:50px; height:50px;">apartment</mat-icon>
          <p>Elige una casa para ver sus cuartos.</p>
        </div>
      </mat-card>
    </div>

    <!-- NIVEL 3: DETALLE POR DISPOSITIVO -->
    <div class="col-md-6">
      <mat-card class="p-4 shadow-sm border-0" style="min-height: 500px;">
        <mat-card-title class="text-danger">3. Gasto por Dispositivo</mat-card-title>

        <label class="mt-3">Selecciona un Cuarto:</label>
        <select class="form-control mb-4" [(ngModel)]="idRoomSel" (change)="onRoomChange()" [disabled]="idHomeSel == -1">
          <option [value]="-1">-- Ver equipos de un cuarto --</option>
          <option *ngFor="let r of misCuartos" [value]="r.idRoom">{{r.name}}</option>
        </select>

        <div style="height: 300px;" *ngIf="idRoomSel != -1">
          <canvas baseChart [data]="deviceData" [type]="'bar'"></canvas>
        </div>
        <div class="text-center mt-5 text-muted" *ngIf="idRoomSel == -1">
          <mat-icon style="font-size: 50px; width:50px; height:50px;">settings_remote</mat-icon>
          <p>Elige un cuarto para ver sus dispositivos.</p>
        </div>
      </mat-card>
    </div>
  </div>
</div>

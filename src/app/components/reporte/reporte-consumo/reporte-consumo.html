<div class="container mt-4 mb-5">
    <!-- Encabezado con Estilo -->
    <mat-toolbar color="primary" class="rounded shadow mb-4">
        <span class="d-flex align-items-center">
            <mat-icon class="mr-2">analytics</mat-icon> 
            Análisis Energético Inteligente
        </span>
    </mat-toolbar>

    <!-- BARRA DE FILTROS DINÁMICA -->
    <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
        <div class="card-body bg-light rounded">
            <div class="row align-items-center">
                
                <!-- 1. Selección de Nivel -->
                <div class="col-md-3">
                    <label class="small font-weight-bold text-muted">¿Qué quieres analizar?</label>
                    <select class="form-control" [(ngModel)]="nivel" (change)="cambiarNivel()">
                        <option value="VIVIENDA">Todas mis Viviendas</option>
                        <option value="CUARTO">Ambientes de una Casa</option>
                        <option value="DISPOSITIVO">Equipos de un Cuarto</option>
                    </select>
                </div>

                <!-- 2. Combo de Casas (Solo si nivel es Cuarto o Dispositivo) -->
                <div class="col-md-3" *ngIf="nivel !== 'VIVIENDA'">
                    <label class="small font-weight-bold text-muted">Seleccionar Casa:</label>
                    <select class="form-control" [(ngModel)]="idHomeSel" (change)="onCasaChange()">
                        <option [value]="-1">-- Elige Propiedad --</option>
                        <option *ngFor="let c of misCasas" [value]="c.idHome">{{c.alias}}</option>
                    </select>
                </div>

                <!-- 3. Combo de Cuartos (Solo si nivel es Dispositivo) -->
                <div class="col-md-3" *ngIf="nivel === 'DISPOSITIVO'">
                    <label class="small font-weight-bold text-muted">Seleccionar Cuarto:</label>
                    <select class="form-control" [(ngModel)]="idRoomSel" (change)="onRoomChange()" [disabled]="idHomeSel == -1">
                        <option [value]="-1">-- Elige Ambiente --</option>
                        <option *ngFor="let r of misCuartos" [value]="r.idRoom">{{r.name}}</option>
                    </select>
                </div>

                <div class="col text-right" *ngIf="nivel === 'VIVIENDA'">
                    <span class="badge badge-success p-2">Mostrando Resumen Global</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ÁREA DEL GRÁFICO ÚNICO -->
    <div class="row">
        <div class="col-12">
            <mat-card class="border-0 shadow-lg p-4" style="border-radius: 20px; min-height: 500px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="m-0 text-dark font-weight-bold">
                        {{ mainChartData.datasets[0].label }}
                    </h2>
                    <mat-icon class="text-secondary">bar_chart</mat-icon>
                </div>

                <!-- Canvas del gráfico -->
                <div style="position: relative; height: 400px; width: 100%;">
                    <canvas baseChart 
                        [data]="mainChartData" 
                        [options]="mainChartOptions" 
                        [type]="'bar'">
                    </canvas>
                </div>

                <!-- Mensaje cuando no hay selección -->
                <div class="text-center mt-4 text-muted" *ngIf="mainChartData.labels?.length === 0">
                    <p>Por favor, completa los filtros superiores para visualizar los datos.</p>
                </div>
            </mat-card>
        </div>
    </div>
</div>

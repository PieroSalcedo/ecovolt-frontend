<div class="container mt-4">
  <div class="row mb-3 align-items-center p-3 border rounded bg-light mx-1 shadow-sm">
    <div class="col-md-3">
      <input class="form-control" placeholder="Nombre..." [(ngModel)]="filtroNombre">
    </div>
    <div class="col-md-3">
      <select class="form-control" [(ngModel)]="filtroHome" (change)="onHomeFilterChange(filtroHome)">
        <option [value]="-1">-- Todas las Viviendas --</option>
        <option *ngFor="let v of viviendas" [value]="v.idHome">{{ v.alias }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-control" [(ngModel)]="filtroRoom" [disabled]="filtroHome === -1">
        <option [value]="-1">-- Todas las Habitaciones --</option>
        <option *ngFor="let c of cuartos" [value]="c.idRoom">{{ c.name }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" (click)="consultar()">BUSCAR</button>
    </div>
  </div>

  <div class="mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" class="w-100">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let x"> {{x.idDevice}} </td>
      </ng-container>
      <ng-container matColumnDef="serial">
        <th mat-header-cell *matHeaderCellDef> Serial / MAC </th>
        <td mat-cell *matCellDef="let x"> <code>{{x.serialNumber}}</code> </td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let x"> <b>{{x.name}}</b> </td>
      </ng-container>
      <ng-container matColumnDef="marca">
        <th mat-header-cell *matHeaderCellDef> Marca </th>
        <td mat-cell *matCellDef="let x"> {{x.brand}} </td>
      </ng-container>
      <ng-container matColumnDef="ambiente">
        <th mat-header-cell *matHeaderCellDef> Habitación </th>
        <td mat-cell *matCellDef="let x"> <span class="badge bg-secondary p-2">{{x.roomName}}</span> </td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let x">
          <button mat-icon-button color="warn" (click)="eliminar(x.idDevice, x.name)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10]"></mat-paginator>
  </div>
</div>

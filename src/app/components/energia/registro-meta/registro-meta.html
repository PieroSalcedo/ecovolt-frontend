<div class="container mt-4 mb-5">
    <mat-toolbar color="primary" class="rounded shadow-sm">
        <span><mat-icon class="mr-2">track_changes</mat-icon> Configurar Límite de Consumo</span>
    </mat-toolbar>

    <div class="card mt-3 shadow border-0" style="border-radius: 15px;">
        <div class="card-body p-4">
            
            <!-- PASO 1: SELECCIONAR NIVEL -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="font-weight-bold text-primary">1. Nivel de Control:</label>
                    <select class="form-control" [(ngModel)]="nivelMeta" (change)="cambioNivel()">
                        <option value="CASA">Toda la Vivienda</option>
                        <option value="CUARTO">Un Ambiente (Cuarto)</option>
                        <option value="DISPOSITIVO">Un Dispositivo IoT</option>
                    </select>
                </div>
                <div class="col-md-8 d-flex align-items-center">
                    <p class="text-muted m-0 small italic">
                        <mat-icon style="font-size: 16px; vertical-align: middle;">help_outline</mat-icon>
                        Elige qué quieres delimitar para recibir alertas de sobreconsumo.
                    </p>
                </div>
            </div>

            <hr>

            <!-- PASO 2: SELECCIÓN EN CASCADA -->
            <div class="row mt-4">
                
                <!-- Siempre elegir Casa primero (Base de la jerarquía) -->
                <div class="col-md-4">
                    <label class="small font-weight-bold">Paso A: Elegir Vivienda</label>
                    <select class="form-control" [(ngModel)]="idHomeAux" (change)="onCasaChange()">
                        <option [value]="-1">-- Selecciona Casa --</option>
                        <option *ngFor="let v of misCasas" [value]="v.idHome">{{ v.alias }}</option>
                    </select>
                </div>

                <!-- Si el nivel es CUARTO o DISPOSITIVO, mostrar selector de Cuartos -->
                <div class="col-md-4" *ngIf="nivelMeta !== 'CASA'">
                    <label class="small font-weight-bold">Paso B: Elegir Ambiente</label>
                    <select class="form-control" [(ngModel)]="idRoomAux" (change)="onRoomChange()" [disabled]="idHomeAux == -1">
                        <option [value]="-1">-- Selecciona Cuarto --</option>
                        <option *ngFor="let r of misCuartos" [value]="r.idRoom">{{ r.name }}</option>
                    </select>
                </div>

                <!-- Si el nivel es DISPOSITIVO, mostrar selector de Equipos -->
                <div class="col-md-4" *ngIf="nivelMeta === 'DISPOSITIVO'">
                    <label class="small font-weight-bold">Paso C: Elegir Dispositivo</label>
                    <select class="form-control" (change)="onDeviceChange(idDev.value)" #idDev [disabled]="idRoomAux == -1">
                        <option [value]="-1">-- Selecciona Equipo --</option>
                        <option *ngFor="let d of misDispositivos" [value]="d.idDevice">{{ d.name }}</option>
                    </select>
                </div>
            </div>

            <!-- PASO 3: VALORES DE LA META -->
            <form [formGroup]="forms" (ngSubmit)="registrar()" class="mt-5 p-4 bg-light rounded border">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Límite Mensual (kWh)</mat-label>
                            <input matInput type="number" formControlName="targetValue" placeholder="Ej: 100">
                            <mat-icon matSuffix>bolt</mat-icon>
                        </mat-form-field>
                    </div>
                    <div class="col-md-4">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>% Umbral de Alerta</mat-label>
                            <input matInput type="number" formControlName="alertThresholdPercentage">
                            <span matSuffix>%</span>
                        </mat-form-field>
                    </div>
                    <div class="col-md-4">
                        <!-- El botón se habilita solo si el ID correspondiente al nivel está seteado -->
                        <button mat-raised-button color="accent" class="w-100" style="height: 55px;" 
                                [disabled]="forms.invalid">
                            <mat-icon>save</mat-icon> ESTABLECER META
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>

<div class="container mt-4">
  <div class="card shadow-sm border-0" style="border-radius: 15px;">
    <div class="card-header bg-primary text-white p-3">
      <h5 class="m-0"><mat-icon style="vertical-align: middle;">meeting_room</mat-icon> Registrar Nuevo Ambiente</h5>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="forms" (ngSubmit)="registrar()">
        
        <div class="row">
          <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Nombre del Ambiente (Ej: Cocina)</mat-label>
            <input matInput formControlName="name">
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Orientación (Ej: Norte / Vista a la calle)</mat-label>
            <input matInput formControlName="orientation">
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Piso</mat-label>
            <input matInput type="number" formControlName="floorNumber">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Metros Cuadrados (m2)</mat-label>
            <input matInput type="number" formControlName="areaSqm">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Vivienda</mat-label>
            <mat-select formControlName="idHome">
              <mat-option [value]="-1">-- Seleccione Casa --</mat-option>
              <mat-option *ngFor="let v of viviendas" [value]="v.idHome">
                {{ v.alias }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Tipo de Ambiente</mat-label>
            <mat-select formControlName="idRoomType">
              <mat-option [value]="-1">-- Seleccione Tipo --</mat-option>
              <mat-option *ngFor="let t of tipos" [value]="t.idDataCatalog">
                {{ t.value }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="text-center mt-3">
          <button mat-raised-button color="primary" class="w-50" style="height: 50px; border-radius: 25px;" [disabled]="forms.invalid">
            <mat-icon>add_circle</mat-icon> GUARDAR AMBIENTE
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

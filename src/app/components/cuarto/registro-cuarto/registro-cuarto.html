<div class="container mt-4 mb-5">
  <div class="card shadow-sm border-0" style="border-radius: 8px; overflow: hidden;">
    <div class="card-header text-white p-3" style="background: linear-gradient(90deg, #0f172a, #4f46e5);">
      <h5 class="m-0 font-weight-bold"><mat-icon style="vertical-align: middle;">meeting_room</mat-icon> Registrar Nuevo Ambiente</h5>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="forms" (ngSubmit)="registrar()">
        
        <div class="row">
          <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Nombre del Ambiente (Ej: Cocina)</mat-label>
            <input matInput formControlName="name">
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Orientaci&oacute;n (Ej: Norte / Vista a la calle)</mat-label>
            <input matInput formControlName="orientation">
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Piso</mat-label>
            <input matInput type="number" formControlName="floorNumber">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Metros Cuadrados (m2)</mat-label>
            <input matInput type="number" formControlName="areaSqm">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Vivienda</mat-label>
            <mat-select formControlName="idHome">
              <mat-option [value]="-1">-- Seleccione Casa --</mat-option>
              <mat-option *ngFor="let v of viviendas" [value]="v.idHome">
                {{ v.alias }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Tipo de Ambiente</mat-label>
            <mat-select formControlName="idRoomType">
              <mat-option [value]="-1">-- Seleccione Tipo --</mat-option>
              <mat-option *ngFor="let t of tipos" [value]="t.idDataCatalog">
                {{ t.value }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="text-center mt-3">
          <button mat-raised-button color="primary" class="ev-glow-btn w-50 font-weight-bold" style="height: 50px; border-radius: 8px; background-color: #4f46e5; color: #fff; box-shadow: 0 10px 22px rgba(79,70,229,.24); transition: all .2s ease;" [disabled]="forms.invalid">
            <mat-icon>add_circle</mat-icon> GUARDAR AMBIENTE
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

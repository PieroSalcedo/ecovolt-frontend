<div class="hero-section position-relative overflow-hidden"
     style="background: radial-gradient(circle at 18% 20%, rgba(34,211,238,.25), transparent 32%), radial-gradient(circle at 82% 30%, rgba(251,191,36,.20), transparent 28%), linear-gradient(135deg, #111827 0%, #312e81 52%, #0e7490 100%); padding: 76px 0 92px; margin-bottom: 0;">
  <div class="container text-center position-relative">
    <span class="badge badge-light px-3 py-2 mb-3 shadow-sm" style="border-radius: 999px;">
      <mat-icon style="font-size: 16px; vertical-align: middle;">bolt</mat-icon>
      Catalogo IoT
    </span>
    <h1 class="display-4 fw-bold mb-3">Planes Ecovolt</h1>
    <p class="lead mb-0">Elige o actualiza el plan de dispositivos conectados.</p>
  </div>
</div>

<div class="container mb-5">
  <div class="d-flex justify-content-between align-items-center mt-5 mb-2">
    <div>
      <span class="text-uppercase font-weight-bold" style="color: #4f46e5; font-size: .78rem;">Catalogo</span>
      <h2 class="font-weight-bold mb-0">Planes Ecovolt</h2>
    </div>
    <span class="badge badge-light px-3 py-2 shadow-sm" style="border-radius: 999px;">
      <mat-icon style="font-size: 16px; vertical-align: middle; color: #f59e0b;">bolt</mat-icon>
      IoT listo
    </span>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-4 mt-4" *ngFor="let p of planes">
      <mat-card class="plan-card h-100 shadow border-0" [style.border-top]="p.idPlan === idPlanActual ? '5px solid #fbbf24' : 'none'">
        <div *ngIf="p.idPlan === idPlanActual" class="bg-warning text-dark text-center small fw-bold py-1">
          TU PLAN ACTUAL
        </div>

        <mat-card-header class="d-block text-center pt-4">
          <mat-card-title class="h3">{{p.name}}</mat-card-title>
          <div class="price-tag my-3">S/ {{p.monthlyPrice}}</div>
        </mat-card-header>
        
        <mat-card-content class="text-center px-4">
          <p>{{p.description}}</p>
          <div class="d-flex align-items-center justify-content-center mb-3 p-3" style="border-radius: 12px; background: #f8fafc;">
            <mat-icon color="primary">bolt</mat-icon>
            <span class="ml-2">Limite: <b>{{p.deviceLimit}}</b> dispositivos</span>
          </div>
        </mat-card-content>

        <mat-card-actions class="justify-content-center pb-4">
          <button mat-raised-button
                  [disabled]="p.idPlan === idPlanActual"
                  [color]="p.idPlan === idPlanActual ? '' : 'primary'"
                  style="border-radius: 999px; padding: 10px 40px; box-shadow: 0 12px 24px rgba(79,70,229,.22);"
                  (click)="ejecutarAccion(p.idPlan)">
            {{ isLogged ? (p.idPlan === idPlanActual ? 'PLAN ACTIVO' : 'MEJORAR AHORA') : 'ELEGIR PLAN' }}
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>

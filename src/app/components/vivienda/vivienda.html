<div class="container mt-4">
    <div class="row align-items-center mb-4">
        <div class="col-md-8">
            <h2 style="color: #1b4332; margin: 0;"><b>🏠 Mis Viviendas</b></h2>
        </div>
        <div class="col-md-4 text-right">
            <button mat-raised-button color="primary" style="background-color: #2d6a4f;" (click)="openModal()">
                <mat-icon>add</mat-icon> REGISTRAR VIVIENDA
            </button>
        </div>
    </div>

    <!-- FILTROS (Refresco al escribir) -->
    <div class="row bg-white p-3 shadow-sm rounded mb-4">
        <div class="col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Nombre / Alias</mat-label>
                <input matInput [(ngModel)]="alias" (keyup)="consultar()">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
        <div class="col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Ciudad</mat-label>
                <input matInput [(ngModel)]="city" (keyup)="consultar()">
            </mat-form-field>
        </div>
        <div class="col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Tipo de Propiedad</mat-label>
                <mat-select [(ngModel)]="idTipo" (selectionChange)="consultar()">
                    <mat-option [value]="-1">[ Todos ]</mat-option>
                    <mat-option *ngFor="let t of tipos" [value]="t.idDataCatalog">{{t.description}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>

    <!-- GRILLA -->
    <div class="mat-elevation-z8 rounded overflow-hidden">
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="idHome"><th mat-header-cell *matHeaderCellDef> ID </th><td mat-cell *matCellDef="let e"> {{e.idHome}} </td></ng-container>
            <ng-container matColumnDef="alias"><th mat-header-cell *matHeaderCellDef> Vivienda </th><td mat-cell *matCellDef="let e"> <b>{{e.alias}}</b> </td></ng-container>
            <ng-container matColumnDef="address"><th mat-header-cell *matHeaderCellDef> Dirección </th><td mat-cell *matCellDef="let e"> {{e.address}} </td></ng-container>
            <ng-container matColumnDef="city"><th mat-header-cell *matHeaderCellDef> Ciudad </th><td mat-cell *matCellDef="let e"> {{e.city}} </td></ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let e">
                    <button mat-icon-button color="primary" (click)="openModal(e)"><mat-icon>edit</mat-icon></button>
                    <button mat-icon-button color="warn" (click)="eliminar(e)"><mat-icon>delete</mat-icon></button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
    </div>
</div>

<div class="container mt-4">
  <div class="row mb-3 align-items-center p-3 border rounded bg-light mx-1">
    <div class="col-md-3"><input class="form-control" placeholder="Alias" [(ngModel)]="alias"></div>
    <div class="col-md-3"><input class="form-control" placeholder="Ciudad" [(ngModel)]="city"></div>
    <div class="col-md-3">
      <select class="form-control" [(ngModel)]="idTipo">
        <option [value]="-1">-- Todos los tipos --</option>
        <option *ngFor="let t of tipos" [value]="t.idDataCatalog">
            {{ t.value }}  <!-- AQUI: Asegúrate que diga .value -->
        </option>
      </select>
    </div>
    <div class="col-md-3"><button class="btn btn-primary w-100" (click)="consultar()">BUSCAR</button></div>
  </div>

  <div class="mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" class="w-100">
      <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let x">{{x.idHome}}</td></ng-container>
      <ng-container matColumnDef="alias"><th mat-header-cell *matHeaderCellDef>Alias</th><td mat-cell *matCellDef="let x"><b>{{x.alias}}</b></td></ng-container>
      <ng-container matColumnDef="ciudad"><th mat-header-cell *matHeaderCellDef>Ciudad</th><td mat-cell *matCellDef="let x">{{x.city}}</td></ng-container>
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <!-- En el DTO el campo se llama propertyTypeName (el mapper lo llena solo) -->
        <td mat-cell *matCellDef="let x"> {{ x.propertyTypeName }} </td>
      </ng-container>
      <ng-container matColumnDef="tarifa"><th mat-header-cell *matHeaderCellDef>Tarifa</th><td mat-cell *matCellDef="let x">S/ {{x.energyTariff}}</td></ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let x">
          <button mat-icon-button color="primary"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="eliminar(x.idHome)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10]"></mat-paginator>
  </div>
</div>
